<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Regional Intelligence Workbench</title>
  <desc id="desc">A polished product card showing a public-source regional intelligence flow from sources to analyst and client views.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.46" stop-color="#12343b"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f4c95d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="34" fill="url(#bg)"/>
  <path d="M0 401 C185 334 306 376 451 313 C625 237 760 269 923 191 C1059 126 1150 118 1280 154 L1280 520 L0 520 Z" fill="#0f766e" opacity="0.18"/>

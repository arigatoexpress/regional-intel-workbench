    <text x="38" y="209" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#cbd5e1">Public-source regional intelligence for</text>
    <text x="38" y="241" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#cbd5e1">market research, brokerage workflows,</text>
    <text x="38" y="273" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#cbd5e1">and provenance-ready OODA packets.</text>
    <g transform="translate(38 314)">

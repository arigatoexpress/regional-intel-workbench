    <text x="38" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="750" fill="#f8fafc">Regional Intelligence</text>
    <text x="38" y="125" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="750" fill="#f8fafc">Workbench</text>

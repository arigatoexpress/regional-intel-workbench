[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "regional-intel-workbench"
version = "0.1.0"
description = "Ethical regional intelligence workbench with client feeds, graphs, and analyst workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "playwright>=1.55.0,<2.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.scripts]
regional-intel = "app.cli:main"
ve-vote-monitor = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
